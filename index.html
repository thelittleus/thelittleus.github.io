/* ===== little us · new navigation, homepage, request page ===== */
:root{--tabh:calc(64px + env(safe-area-inset-bottom))}
.free-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;background:var(--mint);color:var(--success);padding:2px 8px;border-radius:99px;line-height:1.4;white-space:nowrap}
.free-pill.green{background:var(--mint)}
.new-pill{font-size:10.5px;font-weight:800;background:var(--sunny);color:var(--ink);padding:1px 7px;border-radius:99px;margin-left:4px}
.lang-tog{display:inline-flex;align-items:center;gap:2px;height:36px;padding:3px;border-radius:999px;background:#fff;border:1px solid var(--line);flex:none}
.lang-tog button{height:28px;min-width:34px;padding:0 9px;border-radius:999px;border:0;background:none;font:700 12px Figtree,sans-serif;color:var(--body);cursor:pointer}
.lang-tog button.on{background:var(--sunny);color:var(--ink)}
.hdr-m .hdr-row{gap:8px}
.hdr-m .icon-btn{width:42px;height:42px}
/* bottom tab bar (phones) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--tabh);padding:6px 8px env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -6px 20px #0000000a}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabbar a.on{color:var(--ink);font-weight:800}
.tb-ico{position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:30px;border-radius:999px}
.tabbar a.on .tb-ico{background:var(--butter)}
.tb-ico .badge{top:-3px;right:4px}
body{padding-bottom:var(--tabh)}
body.tl-childon .tabbar{display:none}
.toasts{bottom:calc(var(--tabh) + 12px)}
.cookie{bottom:calc(var(--tabh) + 12px)}
.buybar{bottom:var(--tabh)}
/* desktop navigation */
.hdr2{gap:26px}
.nav2{display:flex;align-items:center;gap:26px;font-size:15px;font-weight:600}
.nav2>a,.navdd>button{display:inline-flex;align-items:center;gap:8px;text-decoration:none;padding:4px 0 3px;border:0;border-bottom:2.5px solid transparent;background:none;font:600 15px Figtree,sans-serif;color:var(--ink);cursor:pointer}
.nav2>a.on,.navdd>button.on{border-bottom-color:var(--sunny)}
.navdd{position:relative}
.chev{width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin:-4px 0 0 2px}

.h2-art{position:relative;height:220px;z-index:1}.h2-scene{position:absolute;inset:0;z-index:0;pointer-events:none}.h2-scene .h2-hills{position:absolute;left:0;bottom:0;width:100%;height:26%}.h2-scene .h2-sky{position:absolute;right:-14px;top:-8px;width:170px;height:auto;opacity:.95}.h2-hero.has-scene{background-image:radial-gradient(rgba(255,255,255,.6) 1px,transparent 1.5px);background-size:11px 11px}@media (min-width:900px){.h2-scene .h2-hills{height:25%}.h2-scene .h2-sky{width:300px;right:0;top:0}}.h2-hero>.h2-copy,.h2-hero>.h2-art{z-index:1}.h2-hero.has-scene>.deco{display:none}.h2-hero.has-scene .h2-sun,.h2-hero.has-scene .h2-dot{display:none}.lu-drift{animation:luDrift 26s ease-in-out infinite alternate}.lu-drift.c2{animation-duration:34s;animation-delay:-9s}@keyframes luDrift{from{transform:translateX(-18px)}to{transform:translateX(26px)}}.lu-spin{animation:luSpin 40s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes luSpin{to{transform:rotate(360deg)}}.lu-twinkle{animation:luTw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.lu-twinkle.t2{animation-delay:-1.6s}@keyframes luTw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.05)}}@media (prefers-reduced-motion:reduce){.lu-drift,.lu-spin,.lu-twinkle{animation:none}}.h2-vis .h2-talk{width:96px;height:96px;display:flex}.h2-vis .h2-talk svg{width:100%;height:100%}
.h2-sun{position:absolute;right:4%;top:0;width:150px;height:150px;border-radius:50%;background:var(--sunny)}

/* tools menu (desktop) */
.ts-dd{position:relative}
.ts-ddbtn{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 6px;border-radius:999px;background:#fff;border:1.5px solid var(--sunny);font:700 15px Figtree,sans-serif;color:var(--ink);cursor:pointer}
.ts-ddbtn:hover{box-shadow:0 0 0 3px rgba(255,201,74,.35)}
.ts-chev{width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) translate(-2px,-2px);margin-left:4px;transition:transform .15s}
.ts-dd.open .ts-chev{transform:rotate(-135deg) translate(-2px,-2px)}
.ts-ddpanel{display:none;position:absolute;top:calc(100% + 10px);left:0;z-index:60;width:min(560px,90vw);background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 18px 40px rgba(43,42,53,.12);grid-template-columns:1fr 1fr;gap:6px 14px}
.ts-dd.open .ts-ddpanel{display:grid}
.ts-ddgrp{display:flex;flex-direction:column;gap:2px}
.ts-ddgrp small{font:700 11.5px Figtree,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 6px}
.ts-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;text-decoration:none;color:var(--ink)}
.ts-item b{font-size:15px;font-weight:700}
.ts-item:hover{background:var(--paper);color:var(--ink)}
.ts-item.on{background:var(--sand)}
.ts-all{grid-column:1/-1;border-top:1px solid var(--line-soft);margin-top:6px;padding:10px 10px 2px;font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:4px;color:var(--ink)}
.tools-sub2{display:flex;align-items:center;gap:6px;padding:10px 40px 12px;border-top:1px solid var(--line-soft)}
.ts-pill{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 16px 0 6px;border-radius:999px;text-decoration:none;font-size:14.5px;font-weight:600;color:var(--ink);border:1.5px solid transparent}
.ts-pill:hover{background:#fff;color:var(--ink)}
.ts-pill.on{background:#fff;border-color:var(--ink);font-weight:700;box-shadow:0 2px 0 var(--ink)}
.ts-ico{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ts-prof{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 12px 0 5px;border-radius:999px;background:#fff;border:1px solid var(--line);font:600 14.5px Figtree,sans-serif;color:var(--ink);cursor:pointer;margin-right:8px}
.ts-ava{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ts-prof .chev3{font-size:10px;color:var(--muted)}
.ts-link{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:999px;text-decoration:none;font-size:14.5px;font-weight:600;color:var(--ink)}
.ts-link:hover,.ts-link.on{background:#fff;color:var(--ink)}
.ts-gear{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ts-gear.on{border:1.5px solid var(--ink)}
</style>

`,run:function(){(function(){const{$:o,$$:f,esc:e,t:i}=LU;let r="all",_="";LU.page({strings:{en:{title:"Questions & answers",searchQ:"Search questions",none:"No questions match that search.",cats:{all:"All",downloads:"Downloads",payment:"Payment",using:"Using resources"},more:"Still have a question? We usually reply within one working day.",contact:"Contact us",faqs:[["downloads","How do I get my files after paying?","After you pay, upload your proof of payment on your order page. We check it and confirm your order within 1×24 hours. Your Download buttons then appear on the order page, and we email you as soon as they're ready. Each file can be downloaded up to 5 times within 30 days."],["downloads","I didn't get my email. What now?",`Check your spam or promotions folder first. If it isn't there, use <a href="#/find-order">Find my order</a> with your email and order number and we'll email your order link again. If you ordered on this device, the order is also listed there.`],["downloads","My downloads have expired. Can I get more time?",`Yes. <a href="#/contact">Contact us</a> with your order number and we'll extend your download period or reset your download count.`],["downloads","Can I download on my phone?","Yes. Files download like any other PDF. For printing, many people find it easier to download on a computer, but phones and tablets work too."],["downloads","What format are the files?","Most resources are A4 PDFs. Bundles usually come as a ZIP file containing several PDFs. The format and file size are listed on every product page."],["payment","Do I need to create an account?","No. Just enter your name and email at checkout. You get a private order page where you pay, upload your proof and download your files, and we email you its link."],["payment","Which payment methods can I use?","In Rupiah: bank transfer or QRIS (scan with any banking or e-wallet app). In US Dollars: PayPal. The exact amount and account details are shown on your order page after checkout."],["payment","I've paid. What happens next?","Upload a screenshot or photo of your receipt on your order page. We'll check it and confirm your order within 1×24 hours, and your order page updates by itself. If we can't match the payment, we'll tell you why and you can upload a new proof. Orders without a proof are cancelled after 24 hours."],["payment","Can I pay in US Dollars?","Yes. Switch the currency to USD at the top of the page (or in the menu on your phone). US Dollar orders are paid with PayPal. A few resources are only sold in Rupiah."],["payment","Can I get a refund?",`If a file is damaged, incomplete, very different from its description, or you bought it twice, we'll fix it or refund you. Because files are digital, we can't refund after download for a change of mind. See our <a href="#/refund">Refund Policy</a>.`],["using","Can I print a resource more than once?","Yes. Print as many copies as you need for the children you support."],["using","Can I use resources with my whole caseload?",'Therapists and teachers can use one copy across their own caseload or classroom. For a whole school, clinic or team, <a href="#/contact">contact us</a> about a multi-user license.'],["using","Can I share a file with my child's school or therapist?",'Please share our website link instead of the file. If a school or clinic wants to use a resource with many children, we offer team licenses. See our <a href="#/license">License</a>.'],["using","Are resources available in Bahasa Indonesia?","Many are. Each product shows its language: English (EN), Bahasa Indonesia (ID) or bilingual (EN/ID). You can filter by language in the shop."],["using","Can I request a resource?",`Yes, please do. <a href="#/contact?topic=suggest">Tell us</a> what your learner needs and we'll consider it for a future resource.`]]},id:{title:"Tanya jawab",searchQ:"Cari pertanyaan",none:"Tidak ada pertanyaan yang cocok.",cats:{all:"Semua",downloads:"Unduhan",payment:"Pembayaran",using:"Memakai sumber"},more:"Masih ada pertanyaan? Biasanya kami membalas dalam satu hari kerja.",contact:"Hubungi kami",faqs:[["downloads","Bagaimana cara mendapatkan file setelah membayar?","Setelah membayar, unggah bukti pembayaran di halaman pesananmu. Kami akan mengeceknya dan mengonfirmasi pesanan dalam 1×24 jam. Tombol Unduh lalu muncul di halaman pesanan, dan kami mengirim email begitu file siap. Setiap file dapat diunduh hingga 5 kali dalam 30 hari."],["downloads","Saya tidak menerima email. Bagaimana?",'Cek dulu folder spam atau promosi. Jika tidak ada, pakai <a href="#/find-order">Cari pesanan saya</a> dengan email dan nomor pesanan, lalu kami kirim ulang link pesananmu. Jika kamu memesan dari perangkat ini, pesanannya juga tercantum di sana.'],["downloads","Masa unduh sudah habis. Bisa minta tambahan waktu?",'Bisa. <a href="#/contact">Hubungi kami</a> dengan nomor pesanan dan kami akan memperpanjang masa unduh atau mengatur ulang jatah unduhanmu.'],["downloads","Bisakah saya mengunduh lewat ponsel?","Bisa. File terunduh seperti PDF biasa. Untuk mencetak, banyak orang merasa lebih mudah lewat komputer, tetapi ponsel dan tablet juga bisa."],["downloads","Apa format filenya?","Sebagian besar berupa PDF ukuran A4. Paket biasanya berupa file ZIP berisi beberapa PDF. Format dan ukuran file tercantum di setiap halaman produk."],["payment","Apakah saya perlu membuat akun?","Tidak. Cukup isi nama dan email saat checkout. Kamu mendapat halaman pesanan pribadi untuk membayar, mengunggah bukti, dan mengunduh file, dan link-nya kami kirim ke email."],["payment","Metode pembayaran apa saja yang bisa dipakai?","Dalam Rupiah: transfer bank atau QRIS (pindai dengan aplikasi bank atau dompet digital apa pun). Dalam Dolar AS: PayPal. Jumlah persis dan detail rekening tertera di halaman pesanan setelah checkout."],["payment","Saya sudah membayar. Lalu apa?","Unggah tangkapan layar atau foto bukti transfer di halaman pesananmu. Kami akan mengeceknya dan mengonfirmasi pesanan dalam 1×24 jam, dan halaman pesanan diperbarui otomatis. Jika pembayaran belum bisa dicocokkan, kami akan memberi tahu alasannya dan kamu bisa mengunggah bukti baru. Pesanan tanpa bukti dibatalkan setelah 24 jam."],["payment","Bisakah saya membayar dalam Dolar AS?","Bisa. Ganti mata uang ke USD di bagian atas halaman (atau di menu pada ponsel). Pesanan dalam Dolar AS dibayar lewat PayPal. Beberapa sumber hanya dijual dalam Rupiah."],["payment","Bisakah saya meminta pengembalian dana?",'Jika file rusak, tidak lengkap, sangat berbeda dari deskripsi, atau kamu membelinya dua kali, kami akan memperbaiki atau mengembalikan dana. Karena berupa file digital, kami tidak bisa mengembalikan dana setelah diunduh karena berubah pikiran. Lihat <a href="#/refund">Kebijakan Pengembalian Dana</a>.'],["using","Bolehkah saya mencetak lebih dari sekali?","Boleh. Cetak sebanyak yang dibutuhkan untuk anak-anak yang kamu dampingi."],["using","Bolehkah saya memakainya untuk semua anak yang saya tangani?",'Terapis dan guru boleh memakai satu salinan untuk seluruh anak yang ia tangani atau untuk kelasnya sendiri. Untuk satu sekolah, klinik, atau tim, <a href="#/contact">hubungi kami</a> soal lisensi multi-pengguna.'],["using","Bolehkah saya membagikan file ke sekolah atau terapis anak saya?",'Mohon bagikan link situs kami, bukan file-nya. Jika sekolah atau klinik ingin memakai sumber untuk banyak anak, kami punya lisensi tim. Lihat <a href="#/license">Lisensi</a> kami.'],["using","Apakah tersedia dalam Bahasa Indonesia?","Banyak yang tersedia. Setiap produk mencantumkan bahasanya: Inggris (EN), Bahasa Indonesia (ID), atau dwibahasa (EN/ID). Kamu bisa memfilter berdasarkan bahasa di toko."],["using","Bisakah saya meminta sumber tertentu?",'Bisa, silakan. <a href="#/contact?topic=suggest">Ceritakan</a> kebutuhan anak didikmu dan kami akan mempertimbangkannya untuk sumber berikutnya.']]}},title:"title",init(){o("#faqSearch").oninput=x=>{_=x.target.value.toLowerCase(),c()}},render(){o("#cats").innerHTML=Object.keys(i("c `,run:function(){LULegal({title:{en:"Terms & Conditions",id:"Syarat & Ketentuan"},updated:{en:"Last updated 7 October 2026",id:"Terakhir diperbarui 7 Oktober 2026"},body:{en:`<p>These terms explain how you can use the little us website and what happens when you buy or download a resource from us. Please read them before placing an order. If anything is unclear, contact us and we'll be glad to explain.</p><section><h2>1. Who we are</h2><p>little us sells printable learning resources (worksheets, social stories, visual schedules, task cards and bundles) as digital downloads. The shop is run by Haikal Ilham Adlan, a special education teacher based in {city}.</p><p>You can reach us on WhatsApp at <a href="{waLink}">{wa}</a> or by email at <a href="mailto:{email}">{email}</a>.</p></section><section><h2>2. Accepting these terms</h2><p>By using this website or placing an order, you agree to these Terms &amp; Conditions, our <a href="#/license">License</a>, our <a href="#/refund">Refund Policy</a> and our <a href="#/privacy">Privacy Policy</a>. At checkout you'll be asked to confirm this before you pay.</p></section><section><h2>3. Our products</h2><ul><li>All products are digital files, usually PDF (A4) or ZIP files containing PDFs. Nothing is shipped to you.</li><li>Each product page lists what's included, the age range, language, number of pages, file format and file size, with preview images so you can see what you're buying.</li><li>Printed colours can look slightly different from your screen depending on your printer and paper.</li><li>You'll need a device that can open PDF files and, if you want paper copies, access to a printer.</li></ul></section><section><h2>4. Prices and payment</h2><ul><li>Prices are shown in Indonesian Rupiah (IDR) and, for buyers outside Indonesia, in US Dollars (USD). You choose the currency before you check out.</li><li>Rupiah orders are paid by bank transfer or QRIS to our account. US Dollar orders are paid through PayPal. The exact amount and account details are shown on your order page and in your order email. We never see or store your card details.</li><li>After paying, upload a screenshot or photo of your payment receipt on your order page. We check it and confirm your order, usually within 1×24 hours.</li><li>Orders without a payment proof after 24 hours are cancelled automatically. If you paid but couldn't upload your proof in time, contact us and we'll sort it out.</li><li>We may change prices at any time, but changes never affect orders you've already placed. If a product is listed at an obviously wrong price, we may cancel that order and refund anything you paid.</li></ul></section><section><h2>5. Delivery of your files</h2><ul><li>Once we confirm your payment, your files appear on your order page and we email you a link to that page. Your order page link is also emailed to you when you place the order, so please keep it.</li><li>Each file can be downloaded up to 5 times within 30 days of your payment being confirmed. This keeps your files safe. If you need more time or downloads, contact us and we'll help.</li><li>Lost your link? Request it again on <a href="#/find-order">Find my order</a> with your email and order number. We only send it to the email used at checkout.</li><li>Please save a copy of your files on your own device once downloaded.</li><li>Please make sure your email address is correct. We aren't responsible for emails that can't be delivered because of a mistyped address, but we'll help you if you contact us.</li></ul></section><section><h2>6. Free resources</h2><p>Some resources are free. To download them we ask for your email address so we can send you a link to your files. Joining our mailing list is optional and only happens if you tick the box. You can unsubscribe at any time using the link in our emails.</p></section><section><h2>7. How you may use the resources</h2><p>Buying a resource gives you a personal license to use it with the children you support, at home, in therapy sessions or in your own classroom. You may not share, resell or upload the files where others can access them. The full rules are in our <a href="#/license">License</a>.</p></section><section><h2>8. Refunds</h2><p>Because our products are digital downloads, refunds are limited to the situations described in our <a href="#/refund">Refund Policy</a>, for example a damaged or incomplete file, a file that is very different from its description, or a duplicate purchase. This does not affect your rights under Indonesian consumer protection law.</p></section><section><h2>9. Discount codes</h2><p>Discount codes can be entered in your cart. Each code has its own conditions, such as an expiry date, a usage limit or the products it applies to. Only one code can be used per order, and codes have no cash value.</p></section><section><h2>10. Copyright</h2><p>All resources, text, illustrations and the little us name and logo belong to little us or are licensed to us, and are protected by Indonesian copyright law (UU No. 28 Tahun 2014). Buying a resource gives you a license to use it, not ownership of the content.</p></section><section><h2>11. Educational content</h2><p>Our resources are designed to support learning at home, in therapy and in class. They are not a substitute for an individual assessment, diagnosis or therapy plan from a qualified professional. Please choose activities that suit each child, and supervise children when they use scissors, small pieces or other materials.</p></section><section><h2>12. Our responsibility</h2><p>We work hard to make sure our files are accurate and work as described. To the extent permitted by Indonesian law, our total responsibility for any order is limited to the amount you paid for it. Nothing in these terms limits rights you have that cannot be excluded by law.</p></section><section><h2>13. Questions and complaints</h2><p>If something isn't right, contact us on WhatsApp at <a href="{waLink}">{wa}</a> or by email at <a href="mailto:{email}">{email}</a>, with your order number if you have one. We aim to reply within 1 working day and to resolve complaints within 14 days.</p></section><section><h2>14. Changes to these terms</h2><p>We may update these terms from time to time. The date at the top shows when they were last changed. The version in place when you placed your order applies to that order.</p></section><section><h2>15. Governing law</h2><p>These terms are governed by the laws of the Republic of Indonesia. We'll always try to resolve any disagreement with you directly and in good faith first. If we can't, either of us may use the dispute resolution options available under Indonesian law.</p></section>`,id:'<p>Syarat ini menjelaskan cara memakai situs little us dan apa yang terjadi saat kamu membeli atau mengunduh sumber dari kami. Mohon dibaca sebelum memesan. Jika ada yang kurang jelas, hubungi kami dan kami akan dengan senang hati menjelaskan.</p><section><h2>1. Tentang kami</h2><p>little us menjual sumber belajar siap cetak (lembar kerja, cerita sosial, jadwal visual, kartu tugas, dan paket) dalam bentuk file digital. Toko ini dijalankan oleh Haikal Ilham Adlan, guru pendidikan khusus yang berdomisili di {city}.</p><p>Kamu bisa menghubungi kami lewat WhatsApp di <a href="{waLink}">{wa}</a> atau email ke <a href="mailto:{email}">{email}</a>.</p></section><section><h2>2. Persetujuan atas syarat ini</h2><p>Dengan memakai situs ini atau melakukan pemesanan, kamu menyetujui Syarat &amp; Ketentuan ini, <a href="#/license">Lisensi</a>, <a href="#/refund">Kebijakan Pengembalian Dana</a>, dan <a href="#/privacy">Kebijakan Privasi</a> kami. Saat checkout kamu akan diminta mengonfirmasi hal ini sebelum membayar.</p></section><section><h2>3. Produk kami</h2><ul><li>Semua produk berupa file digital, biasanya PDF (A4) atau file ZIP berisi PDF. Tidak ada barang yang dikirim secara fisik.</li><li>Setiap halaman produk mencantumkan isi, rentang usia, bahasa, jumlah halaman, format, dan ukuran file, beserta gambar pratinjau agar kamu tahu apa yang dibeli.</li><li>Warna hasil cetak bisa sedikit berbeda dari layar, tergantung printer dan kertas yang dipakai.</li><li>Kamu memerlukan perangkat yang bisa membuka file PDF dan, jika ingin versi kertas, akses ke printer.</li></ul></section><section><h2>4. Harga dan pembayaran</h2><ul><li>Harga ditampilkan dalam Rupiah (IDR) dan, untuk pembeli di luar Indonesia, dalam Dolar AS (USD). Kamu memilih mata uang sebelum checkout.</li><li>Pesanan dalam Rupiah dibayar lewat transfer bank atau QRIS ke rekening kami. Pesanan dalam Dolar AS dibayar melalui PayPal. Jumlah persis dan detail rekening tertera di halaman pesanan dan di email pesananmu. Kami tidak pernah melihat atau menyimpan data kartumu.</li><li>Setelah membayar, unggah tangkapan layar atau foto bukti pembayaran di halaman pesananmu. Kami akan memeriksanya dan mengonfirmasi pesanan, biasanya dalam 1×24 jam.</li><li>Pesanan tanpa bukti pembayaran setelah 24 jam akan dibatalkan otomatis. Jika kamu sudah membayar tetapi belum sempat mengunggah bukti, hubungi kami dan kami akan membantu.</li><li>Kami dapat mengubah harga sewaktu-waktu, tetapi perubahan tidak berlaku untuk pesanan yang sudah dibuat. Jika suatu produk tercantum dengan harga yang jelas keliru, kami dapat membatalkan pesanan tersebut dan mengembalikan dana yang sudah dibayar.</li></ul></section><section><h2>5. Pengiriman file</h2><ul><li>Setelah pembayaranmu dikonfirmasi, file muncul di halaman pesanan dan kami mengirim email berisi link ke halaman tersebut. Link halaman pesanan juga dikirim ke email saat kamu membuat pesanan, jadi mohon disimpan.</li><li>Setiap file dapat diunduh hingga 5 kali dalam 30 hari sejak pembayaran dikonfirmasi. Ini untuk menjaga keamanan file. Jika butuh waktu atau jatah unduhan tambahan, hubungi kami dan kami akan membantu.</li><li>Link hilang? Minta lagi di <a href="#/find-order">Cari pesanan saya</a> dengan email dan nomor pesananmu. Link hanya dikirim ke email yang dipakai saat checkout.</li><li>Simpan salinan file di perangkatmu sendiri setelah diunduh.</li><li>Pastikan alamat email yang kamu masukkan benar. Kami tidak bertanggung jawab atas email yang tidak terkirim karena salah ketik, tetapi kami tetap akan membantu jika kamu menghubungi kami.</li></ul></section><section><h2>6. Sumber gratis</h2><p>Beberapa sumber tersedia gratis. Untuk mengunduhnya, kami meminta alamat email agar bisa mengirimkan link. Bergabung dengan daftar email kami bersifat opsional dan hanya terjadi jika kamu mencentang kotaknya. Kamu bisa berhenti berlangganan kapan saja melalui link di email kami.</p></section><section><h2>7. Cara memakai sumber</h2><p>Membeli sumber memberimu lisensi pribadi untuk memakainya bersama anak-anak yang kamu dampingi, di rumah, saat terapi, atau di kelasmu sendiri. File tidak boleh dibagikan, dijual ulang, atau diunggah ke tempat yang bisa diakses orang lain. Aturan lengkapnya ada di <a href="#/license">Lisensi</a> kami.</p></section><section><h2>8. Pengembalian dana</h2><p>Karena produk kami berupa file digital, pengembalian dana terbatas pada situasi yang dijelaskan dalam <a href="#/refund">Kebijakan Pengembalian Dana</a>, misalnya file rusak atau tidak lengkap, file sangat berbeda dari deskripsinya, atau pembelian ganda. Ketentuan ini tidak mengurangi hakmu menurut hukum perlindungan konsumen Indonesia.</p></section><section><h2>9. Kode diskon</h2><p>Kode diskon dapat dimasukkan di keranjang. Setiap kode memiliki ketentuannya sendiri, seperti tanggal kedaluwarsa, batas pemakaian, atau produk yang berlaku. Hanya satu kode yang bisa dipakai per pesanan, dan kode tidak dapat ditukar dengan uang.</p></section><section><h2>10. Hak cipta</h2><p>Semua sumber, teks, ilustrasi, serta nama dan logo little us adalah milik little us atau dilisensikan kepada kami, dan dilindungi oleh UU No. 28 Tahun 2014 tentang Hak Cipta. Membeli sumber memberimu lisensi untuk memakainya, bukan kepemilikan atas isinya.</p></section><section><h2>11. Konten edukasi</h2><p>Sumber kami dirancang untuk mendukung pembelajaran di rumah, saat terapi, dan di kelas. Sumber ini bukan pengganti asesmen, diagnosis, atau rencana terapi individual dari tenaga profesional yang berkualifikasi. Pilih aktivitas yang sesuai untuk setiap anak, dan dampingi anak saat memakai gunting, potongan kecil, atau bahan lainnya.</p></section><section><h2>12. Tanggung jawab kami</h2><p>Kami berusaha memastikan file kami akurat dan berfungsi sesuai deskripsi. Sejauh diizinkan oleh hukum Indonesia, total tanggung jawab kami atas suatu pesanan terbatas pada jumlah yang kamu bayarkan untuk pesanan tersebut. Tidak ada dalam syarat ini yang membatasi hak-hak yang menurut hukum tidak dapat dikecualikan.</p></section><section><h2>13. Pertanyaan dan pengaduan</h2><p>Jika ada yang tidak sesuai, hubungi kami lewat WhatsApp di <a href="{waLink}">{wa}</a> atau email ke <a href="mailto:{email}">{email}</a>, sertakan nomor pesanan jika ada. Kami berusaha membalas dalam 1 hari kerja dan menyelesaikan pengaduan dalam 14 hari.</p></section><section><h2>14. Perubahan syarat</h2><p>Kami dapat memperbarui syarat ini dari waktu ke waktu. Tanggal di bagian atas menunjukkan kapan terakhir diubah. Versi yang berlaku saat kamu memesan adalah yang berlaku untuk pesanan tersebut.</p></section><section><h2>15. Hukum yang berlaku</h2><p>Syarat ini diatur oleh hukum Republik Indonesia. Kami akan selalu berusaha menyelesaikan setiap perbedaan pendapat secara langsung dan dengan itikad baik terlebih dahulu. Jika tidak berhasil, masing-masing pihak dapat menempuh penyelesaian sengketa yang tersedia menurut hukum Indonesia.</p></section>'}})}},J.license={html:`<main class="wrap page"><div class="legal"><nav class="legal-nav" id="legalNav" aria-label="Policies"></nav><article id="doc"></article></div></main>
`,run:function(){LULegal({title:{en:"License & Terms of Use",id:"Lisensi & Ketentuan Pemakaian"},updated:{en:"Last updated 7 October 2026",id:"Terakhir diperbarui 7 Oktober 2026"},body:{en:`<p>The short version, in plain words. The full license follows below.</p><section><h2>You can</h2><div class="can-list"><div><span class="c y">✓</span><span>Print as many copies as you need for the children you support</span></div><div><span class="c y">✓</span><span>Use it at home, in therapy sessions or in your own classroom</span></div><div><span class="c y">✓</span><span>Laminate, cut and adapt pages for your learners</span></div><div><span class="c y">✓</span><span>Show it on screen during online sessions with your learners</span></div></div></section><section><h2>Please don't</h2><div class="can-list"><div><span class="c n">✕</span><span>Share the file with other parents, therapists or teachers</span></div><div><span class="c n">✕</span><span>Upload it to shared drives, groups or websites others can access</span></div><div><span class="c n">✕</span><span>Resell it, or include pages in your own products</span></div><div><span class="c n">✕</span><span>Remove the little us copyright notice</span></div></div></section><section><h2>1. Your license</h2><p>Each purchase gives one person a personal, non-transferable license to use the resource with the children they personally support. Therapists and teachers may use one copy across their own caseload or their own classroom.</p></section><section><h2>2. Free resources</h2><p>Free resources come with the same license. Please share a link to our website instead of sharing the file itself.</p></section><section><h2>3. Copyright</h2><p>All resources remain the property of little us. Illustrations and fonts are licensed to us and can't be extracted for other uses.</p></section><section><h2>4. Schools, clinics and teams</h2><p>Need a license for a whole school, clinic or therapy team? <a href="#/contact">Contact us</a> for multi-user pricing.</p></section><section><h2>5. If the license is broken</h2><p>If a resource is shared or used outside this license, we may cancel the license and disable the download links for that order. We'd much rather help you find the right license, so please ask if you're unsure.</p></section>`,id:'<p>Versi singkatnya, dengan bahasa sederhana. Lisensi lengkap ada di bawah.</p><section><h2>Kamu boleh</h2><div class="can-list"><div><span class="c y">✓</span><span>Mencetak sebanyak yang dibutuhkan untuk anak-anak yang kamu dampingi</span></div><div><span class="c y">✓</span><span>Memakainya di rumah, saat sesi terapi, atau di kelasmu sendiri</span></div><div><span class="c y">✓</span><span>Melaminasi, memotong, dan menyesuaikan halaman untuk anak didikmu</span></div><div><span class="c y">✓</span><span>Menampilkannya di layar saat sesi daring bersama anak didikmu</span></div></div></section><section><h2>Mohon jangan</h2><div class="can-list"><div><span class="c n">✕</span><span>Membagikan file kepada orang tua, terapis, atau guru lain</span></div><div><span class="c n">✕</span><span>Mengunggahnya ke drive bersama, grup, atau situs yang bisa diakses orang lain</span></div><div><span class="c n">✕</span><span>Menjual ulang, atau memasukkan halamannya ke produkmu sendiri</span></div><div><span class="c n">✕</span><span>Menghapus tanda hak cipta little us</span></div></div></section><section><h2>1. Lisensimu</h2><p>Setiap pembelian memberi satu orang lisensi pribadi yang tidak dapat dipindahtangankan untuk memakai sumber tersebut bersama anak-anak yang ia dampingi secara langsung. Terapis dan guru boleh memakai satu salinan untuk seluruh anak yang ia tangani atau untuk kelasnya sendiri.</p></section><section><h2>2. Sumber gratis</h2><p>Sumber gratis memiliki lisensi yang sama. Mohon bagikan link situs kami, bukan file-nya langsung.</p></section><section><h2>3. Hak cipta</h2><p>Semua sumber tetap menjadi milik little us. Ilustrasi dan font dilisensikan kepada kami dan tidak boleh diambil untuk keperluan lain.</p></section><section><h2>4. Sekolah, klinik, dan tim</h2><p>Butuh lisensi untuk satu sekolah, klinik, atau tim terapi? <a href="#/contact">Hubungi kami</a> untuk harga multi-pengguna.</p></section><section><h2>5. Jika lisensi dilanggar</h2><p>Jika sumber dibagikan atau dipakai di luar lisensi ini, kami dapat membatalkan lisensi dan menonaktifkan link unduhan untuk pesanan tersebut. Kami lebih senang membantumu menemukan lisensi yang tepat, jadi tanyakan saja jika ragu.</p></section>'}})}},J.refund={html:`<main class="wrap page"><div class="legal"><nav class="legal-nav" id="legalNav" aria-label="Policies"></nav><article id="doc"></article></div></main>
`,run:function(){LULegal({title:{en:"Refund Policy",id:"Kebijakan Pengembalian Dana"},updated:{en:"Last updated 7 October 2026",id:"Terakhir diperbarui 7 Oktober 2026"},body:{en:`<p>Because our resources are digital downloads, we can't usually offer a refund once a file has been downloaded, simply because a download can't be returned. But if something's wrong, we'll always make it right.</p><section><h2>When we'll refund or replace</h2><ul><li><b>Damaged, incomplete or very different files.</b> If a file won't open, is missing pages, or is very different from its description, contact us within 14 days of purchase. We'll send a corrected file or refund you.</li><li><b>Duplicate purchases.</b> Bought the same item twice? Send us both order numbers and we'll refund the duplicate.</li><li><b>Paid but no files.</b> If you paid but your order wasn't confirmed (for example, it expired before you could upload your proof), we'll either deliver your files or refund you in full.</li><li><b>Paid the wrong amount.</b> If you transferred more than your order total by mistake, we'll refund the difference.</li><li><b>Not downloaded yet.</b> If you haven't downloaded any file from your order, you can ask for a refund within 3 days of your payment being confirmed.</li></ul></section><section><h2>When we can't refund</h2><p>We can't refund a resource after it has been downloaded because you changed your mind, bought it by mistake or found it wasn't the right fit. If you're unsure whether a resource suits your learner, check the previews and description first, or message us before you buy and we'll help you choose.</p></section><section><h2>How to ask for a refund</h2><p>Message us on WhatsApp at <a href="{waLink}">{wa}</a> or email <a href="mailto:{email}">{email}</a> with your order number (it starts with LU-) and a short description of the problem. A screenshot helps if a file isn't working.</p></section><section><h2>How long it takes</h2><p>We reply within 1 working day. Approved refunds are sent within 3 working days: by bank transfer to an account you give us for Rupiah orders, or through PayPal for US Dollar orders. Depending on your bank, it can take a few more days to appear. When an order is refunded, its downloads stop working.</p></section><section><h2>Your rights</h2><p>This policy doesn't affect your rights under Indonesian consumer protection law (UU No. 8 Tahun 1999).</p></section>`,id:'<p>Karena sumber kami berupa file digital, kami biasanya tidak bisa mengembalikan dana setelah file diunduh, karena unduhan memang tidak bisa dikembalikan. Tetapi jika ada yang salah, kami pasti akan memperbaikinya.</p><section><h2>Kapan kami mengembalikan dana atau mengganti file</h2><ul><li><b>File rusak, tidak lengkap, atau sangat berbeda.</b> Jika file tidak bisa dibuka, ada halaman yang hilang, atau sangat berbeda dari deskripsinya, hubungi kami dalam 14 hari sejak pembelian. Kami akan mengirim file yang sudah diperbaiki atau mengembalikan dana.</li><li><b>Pembelian ganda.</b> Membeli item yang sama dua kali? Kirimkan kedua nomor pesanan dan kami akan mengembalikan dana untuk yang dobel.</li><li><b>Sudah bayar tapi file tidak ada.</b> Jika kamu sudah membayar tetapi pesanan belum dikonfirmasi (misalnya kedaluwarsa sebelum sempat mengunggah bukti), kami akan mengirimkan file atau mengembalikan dana sepenuhnya.</li><li><b>Salah jumlah transfer.</b> Jika kamu tidak sengaja mentransfer lebih dari total pesanan, kami akan mengembalikan selisihnya.</li><li><b>Belum diunduh.</b> Jika belum ada file dari pesananmu yang diunduh, kamu bisa meminta pengembalian dana dalam 3 hari sejak pembayaran dikonfirmasi.</li></ul></section><section><h2>Kapan kami tidak bisa mengembalikan dana</h2><p>Kami tidak bisa mengembalikan dana untuk sumber yang sudah diunduh karena berubah pikiran, salah beli, atau ternyata kurang cocok. Jika ragu apakah sebuah sumber cocok untuk anak didikmu, lihat dulu pratinjau dan deskripsinya, atau hubungi kami sebelum membeli dan kami akan membantu memilih.</p></section><section><h2>Cara meminta pengembalian dana</h2><p>Hubungi kami lewat WhatsApp di <a href="{waLink}">{wa}</a> atau email ke <a href="mailto:{email}">{email}</a> dengan nomor pesanan (diawali LU-) dan penjelasan singkat tentang masalahnya. Tangkapan layar akan membantu jika file tidak berfungsi.</p></section><section><h2>Berapa lama prosesnya</h2><p>Kami membalas dalam 1 hari kerja. Pengembalian dana yang disetujui dikirim dalam 3 hari kerja: lewat transfer bank ke rekening yang kamu berikan untuk pesanan dalam Rupiah, atau lewat PayPal untuk pesanan dalam Dolar AS. Tergantung bankmu, dana bisa muncul beberapa hari kemudian. Setelah dana pesanan dikembalikan, unduhannya tidak berfungsi lagi.</p></section><section><h2>Hak-hakmu</h2><p>Kebijakan ini tidak mengurangi hakmu menurut UU No. 8 Tahun 1999 tentang Perlindungan Konsumen.</p></section>'}})}},J.privacy={html:`<main class="wrap page"><div class="legal"><nav class="legal-nav" id="legalNav" aria-label="Policies"></nav><article id="doc"></article></div></main>
`,run:function(){LULegal({title:{en:"Privacy Policy",id:"Kebijakan Privasi"},updated:{en:"Last updated 7 October 2026",id:"Terakhir diperbarui 7 Oktober 2026"},body:{en:`<p>We collect only what we need to deliver your resources and help with your orders. This policy explains what we collect, why, who sees it and the choices you have, in line with Indonesia's Personal Data Protection Law (UU No. 27 Tahun 2022).</p><div class="kv"><div><b>What we collect</b><span>Name, email, optional WhatsApp number and what you bought.</span></div><div><b>Why</b><span>To deliver your files, help with orders and, only if you opt in, send new resources.</span></div><div><b>Who sees it</b><span>Only us and the services we use to run the shop: Supabase (database and file storage), Resend (email) and PayPal if you pay in US Dollars.</span></div><div><b>How long</b><span>Order records for as long as tax law requires; email list until you unsubscribe.</span></div></div><section><h2>1. Who is responsible for your data</h2><p>little us, run by Haikal Ilham Adlan in {city}, is responsible for the personal data described here. Contact: <a href="mailto:{email}">{email}</a> or WhatsApp <a href="{waLink}">{wa}</a>.</p></section><section><h2>2. What we collect</h2><ul><li><b>When you buy:</b> your name, email address, optional WhatsApp number, language, the items you bought, the amount, your payment method and the payment proof you upload (a screenshot or photo of your receipt, which may show your name, bank and account number). We never receive your card details or banking passwords.</li><li><b>When you download a free resource or join our list:</b> your email address, language and whether you agreed to receive updates.</li><li><b>When you contact us:</b> your name, email, order number and message.</li><li><b>When you download files:</b> the time, the order and the file, so we can apply download limits and help if something goes wrong.</li><li><b>Cookies and similar storage:</b> essential storage in your browser for your cart, language, currency, cookie choices and the orders you placed on that device (so we can show you when they're ready). Analytics only if you allow it.</li></ul></section><section><h2>3. Why we use it</h2><ul><li>To process your order and deliver your files (needed to fulfil our agreement with you).</li><li>To answer questions, handle refunds and resend lost links.</li><li>To keep financial records required by Indonesian tax law.</li><li>To send new resources and tips, only if you've opted in. You can withdraw this consent at any time.</li><li>To keep the shop secure and prevent fraud or misuse.</li></ul></section><section><h2>4. Who we share it with</h2><p>We don't sell your data. We share it only with service providers who help us run the shop, and only as much as they need: Supabase (order records, files and payment proofs), Resend (order emails), PayPal (for US Dollar payments) and our website host. Your bank processes any transfer you make to us. Some of these providers store data on servers outside Indonesia; we choose providers that protect data to a standard comparable to Indonesian law. We may also disclose data when the law requires it.</p></section><section><h2>5. How long we keep it</h2><ul><li>Order and payment records: for as long as Indonesian tax law requires (currently up to 10 years).</li><li>Payment proofs and download activity: up to 1 year after your order, unless needed for tax records.</li><li>Mailing list: until you unsubscribe.</li><li>Contact messages: up to 2 years.</li></ul></section><section><h2>6. Your rights</h2><p>You can ask to see, correct or delete your personal data, withdraw consent, object to certain processing or receive a copy of your data. Email us and we'll respond within 3 working days and act on your request within 7 days, except for records we're required to keep for tax. If you're not satisfied, you may also complain to the relevant Indonesian authority.</p></section><section><h2>7. Security</h2><p>Your order records and payment proofs are kept in a private database that only the shop owner can access. Paid files are kept in private storage and delivered through your private order link, with download limits. If a data breach ever affects you, we'll notify you as required by law.</p></section><section><h2>8. Children</h2><p>Our resources are for children, but our shop is for adults. We don't knowingly collect personal data from children, and we never ask for information about the children you support.</p></section><section><h2>9. Changes</h2><p>We may update this policy. The date at the top shows the latest version, and we'll let subscribers know about important changes.</p></section>`,id:'<p>Kami hanya mengumpulkan data yang dibutuhkan untuk mengirim sumber dan membantu pesananmu. Kebijakan ini menjelaskan data apa yang kami kumpulkan, untuk apa, siapa yang melihatnya, dan pilihan yang kamu miliki, sesuai UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi.</p><div class="kv"><div><b>Yang kami kumpulkan</b><span>Nama, email, nomor WhatsApp (opsional), dan apa yang kamu beli.</span></div><div><b>Untuk apa</b><span>Mengirim file, membantu pesanan, dan hanya jika kamu setuju, mengirim sumber baru.</span></div><div><b>Siapa yang melihat</b><span>Hanya kami dan layanan yang kami pakai untuk menjalankan toko: Supabase (database dan penyimpanan file), Resend (email) serta PayPal jika kamu membayar dalam Dolar AS.</span></div><div><b>Berapa lama</b><span>Catatan pesanan selama diwajibkan hukum pajak; daftar email sampai kamu berhenti berlangganan.</span></div></div><section><h2>1. Siapa yang bertanggung jawab atas datamu</h2><p>little us, dijalankan oleh Haikal Ilham Adlan di {city}, bertanggung jawab atas data pribadi yang dijelaskan di sini. Kontak: <a href="mailto:{email}">{email}</a> atau WhatsApp <a href="{waLink}">{wa}</a>.</p></section><section><h2>2. Data yang kami kumpulkan</h2><ul><li><b>Saat membeli:</b> nama, alamat email, nomor WhatsApp (opsional), bahasa, item yang dibeli, jumlah, metode pembayaran, dan bukti pembayaran yang kamu unggah (tangkapan layar atau foto bukti transfer, yang mungkin memuat nama, bank, dan nomor rekeningmu). Kami tidak pernah menerima data kartu atau kata sandi perbankanmu.</li><li><b>Saat mengunduh sumber gratis atau bergabung ke daftar email:</b> alamat email, bahasa, dan apakah kamu setuju menerima kabar terbaru.</li><li><b>Saat menghubungi kami:</b> nama, email, nomor pesanan, dan pesanmu.</li><li><b>Saat mengunduh file:</b> waktu, pesanan, dan file, agar kami bisa menerapkan batas unduhan dan membantu jika ada kendala.</li><li><b>Cookie dan penyimpanan serupa:</b> penyimpanan penting di browsermu untuk keranjang, bahasa, mata uang, pilihan cookie, dan pesanan yang kamu buat di perangkat itu (agar kami bisa memberi tahu saat pesanan siap). Analitik hanya jika kamu izinkan.</li></ul></section><section><h2>3. Untuk apa kami memakainya</h2><ul><li>Memproses pesanan dan mengirim file (dibutuhkan untuk memenuhi perjanjian kami denganmu).</li><li>Menjawab pertanyaan, menangani pengembalian dana, dan mengirim ulang link yang hilang.</li><li>Menyimpan catatan keuangan yang diwajibkan hukum pajak Indonesia.</li><li>Mengirim sumber baru dan tips, hanya jika kamu setuju. Persetujuan ini bisa kamu tarik kapan saja.</li><li>Menjaga keamanan toko dan mencegah penipuan atau penyalahgunaan.</li></ul></section><section><h2>4. Dengan siapa kami berbagi data</h2><p>Kami tidak menjual datamu. Kami hanya membagikannya kepada penyedia layanan yang membantu menjalankan toko, sebatas yang mereka perlukan: Supabase (catatan pesanan, file, dan bukti pembayaran), Resend (email pesanan), PayPal (untuk pembayaran dalam Dolar AS), dan penyedia hosting situs kami. Bankmu memproses transfer yang kamu lakukan kepada kami. Sebagian penyedia ini menyimpan data di server di luar Indonesia; kami memilih penyedia yang melindungi data dengan standar yang setara dengan hukum Indonesia. Kami juga dapat mengungkapkan data jika diwajibkan oleh hukum.</p></section><section><h2>5. Berapa lama kami menyimpannya</h2><ul><li>Catatan pesanan dan pembayaran: selama diwajibkan hukum pajak Indonesia (saat ini hingga 10 tahun).</li><li>Bukti pembayaran dan aktivitas unduhan: hingga 1 tahun setelah pesanan, kecuali dibutuhkan untuk catatan pajak.</li><li>Daftar email: sampai kamu berhenti berlangganan.</li><li>Pesan kontak: hingga 2 tahun.</li></ul></section><section><h2>6. Hak-hakmu</h2><p>Kamu bisa meminta untuk melihat, memperbaiki, atau menghapus data pribadimu, menarik persetujuan, menolak pemrosesan tertentu, atau menerima salinan datamu. Kirim email kepada kami dan kami akan membalas dalam 3 hari kerja serta menindaklanjuti permintaanmu dalam 7 hari, kecuali catatan yang wajib kami simpan untuk keperluan pajak. Jika tidak puas, kamu juga dapat mengadu kepada otoritas Indonesia yang berwenang.</p></section><section><h2>7. Keamanan</h2><p>Catatan pesanan dan bukti pembayaranmu disimpan di basis data privat yang hanya bisa diakses pemilik toko. File berbayar disimpan di penyimpanan privat dan dikirim melalui link pesanan pribadimu, dengan batas unduhan. Jika terjadi kebocoran data yang memengaruhimu, kami akan memberi tahu sesuai ketentuan hukum.</p></section><section><h2>8. Anak-anak</h2><p>Sumber kami untuk anak-anak, tetapi toko kami untuk orang dewasa. Kami tidak dengan sengaja mengumpulkan data pribadi anak, dan kami tidak pernah meminta informasi tentang anak-anak yang kamu dampingi.</p></section><section><h2>9. Perubahan</h2><p>Kami dapat memperbarui kebijakan ini. Tanggal di bagian atas menunjukkan versi terbaru, dan kami akan memberi tahu pelanggan email tentang perubahan penting.</p></section>'}})}},J.unsubscribed={html:`<main class="wrap page"><div class="narrow" style="max-width:520px;display:flex;flex-direction:column;gap:16px;padding-top:12px">
